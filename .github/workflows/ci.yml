# `make ci` is the whole gate: the same steps, in the same order.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    # The desk's layout: the Amber tree is the folder amber above the workspace, where make
    # init-siblings clones the siblings project.toml names; the Makefile finds it in AMBER_ROOT.
    env:
      AMBER_ROOT: ${{ github.workspace }}/../amber
    steps:
      - uses: actions/checkout@v5


      # ols: true brings odinfmt, which make ci's format check calls.
      - uses: Hyperquader-Coders/setup-amber-odin@v1
        with:
          ols: true

      # project.toml's packages, not a second list here.
      - name: system packages
        run: sudo apt-get update && make init-packages APT_FLAGS=-y

      - name: make ci
        run: make ci
