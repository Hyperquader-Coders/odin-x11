# What odin-x11 is and needs: build is what a program on it needs, test what only its own
# tests and checks need. house-rules docs/PROJECT_TOML.md has the layout.
[project]
schema = "amber-project-1"
name = "odin-x11"
license = "MIT AND X11 AND HPND"
kind = "binding"
summary = "Odin bindings for Xlib, Xutil and XKBlib, generated with runic"
tags = [
  "ai-assisted",
  "bindings",
  "linux",
  "odin",
  "runic",
  "x11",
  "xlib",
]
collection = "x11"

[build]
packages = [
  "libx11-dev",
  "libxtst-dev",
]
lib = [
  "xlib",
  "xtest",
]

[test]
packages = [
  "pkg-config",
  "shellcheck",
  "shfmt",
]
